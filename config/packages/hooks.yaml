sylius_twig_hooks:
    hooks:
        'sylius_admin.product.update.content.form.sections.general':
            packable:
                template: 'admin/product/form/sections/general/packable.html.twig'
        'sylius_shop.product.show.page.info.summary.add_to_cart':
            packing:
                template: 'shop/product/show/page/info/summary/add_to_cart/packing.html.twig'
        'sylius_shop.cart.index.form.sections.general.summary':
            packing:
                template: 'shop/cart/index/form/sections/general/summary/packing.html.twig'
                priority: 150
